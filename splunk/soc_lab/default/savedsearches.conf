# Detection rules for the Home SOC Lab.
# Each one runs every 5 minutes over the last 15 minutes and raises a triggered alert.

[SOC Lab - SSH Brute Force]
description = More than 20 failed SSH logins from one source IP in 15 minutes. MITRE T1110.001
search = index=soc_lab sourcetype=linux_secure action=failure \
| stats count AS failures dc(user) AS users_tried values(user) AS usernames BY src_ip \
| where failures > 20 \
| eval severity="high", mitre="T1110.001"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[SOC Lab - Successful Login After Brute Force]
description = A source IP that failed many times then logged in successfully. Likely account compromise. MITRE T1110 / T1078
search = index=soc_lab sourcetype=linux_secure (action=failure OR action=success) \
| stats count(eval(action="failure")) AS failures count(eval(action="success")) AS successes \
        latest(eval(if(action="success",user,null()))) AS compromised_user BY src_ip \
| where failures > 10 AND successes > 0 \
| eval severity="critical", mitre="T1110,T1078"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
relation = greater than
quantity = 0

[SOC Lab - Password Spraying]
description = One source IP trying 8 or more different usernames. MITRE T1110.003
search = index=soc_lab sourcetype=linux_secure action=failure \
| stats dc(user) AS distinct_users count AS attempts values(user) AS usernames BY src_ip \
| where distinct_users >= 8 \
| eval severity="high", mitre="T1110.003"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[SOC Lab - Suspicious Sudo Command]
description = Sudo used to read credential files or download files. MITRE T1548.003 / T1003.008 / T1105
search = index=soc_lab sourcetype=linux_secure action=sudo \
| where match(sudo_command, "(?i)/etc/shadow|/etc/passwd|wget |curl |nc |chmod \+s") \
| table _time host sudo_user sudo_command \
| eval severity="high", mitre="T1548.003"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[SOC Lab - Web Directory Scanning]
description = One client generating 25 or more 403/404 responses in 15 minutes, or a known scanner user agent. MITRE T1595.003
search = index=soc_lab sourcetype=access_combined (status=404 OR status=403) \
| stats count AS errors dc(uri_path) AS unique_paths values(useragent) AS user_agents BY clientip \
| where errors >= 25 OR match(mvjoin(user_agents," "), "(?i)gobuster|dirbuster|nikto|ffuf|dirb") \
| eval severity="medium", mitre="T1595.003"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0

[SOC Lab - SQL Injection Attempt]
description = SQL injection patterns in the request URL. MITRE T1190
search = index=soc_lab sourcetype=access_combined \
| eval decoded=urldecode(uri) \
| where match(decoded, "(?i)union\s+select|'\s*or\s*'1'\s*=\s*'1|sleep\(|drop\s+table|'--") \
| table _time clientip status useragent decoded \
| eval severity="high", mitre="T1190"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
