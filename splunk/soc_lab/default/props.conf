# Extra field extractions for SSH and sudo events in linux_secure
[linux_secure]
EXTRACT-ssh_fail    = Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})
EXTRACT-ssh_success = Accepted password for (?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})
EXTRACT-sudo        = sudo:\s+(?<sudo_user>\S+)\s+:.*COMMAND=(?<sudo_command>.+)$
EVAL-action = case(match(_raw,"Failed password"),"failure", match(_raw,"Accepted password"),"success", match(_raw,"sudo:"),"sudo")
